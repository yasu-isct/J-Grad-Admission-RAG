name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      HF_HUB_OFFLINE: "1"
      HF_HOME: ${{ runner.temp }}/jgrad-hf-home
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"
      - name: Run offline tests
        run: python -m pytest -m "not model_integration"
      - name: Lint and format
        run: |
          ruff check . --no-cache
          ruff format --check . --no-cache
      - name: Compile sources and tests
        run: python -m compileall -q src tests
      - name: Check patch whitespace
        run: git diff --check
      - name: Check frozen semantic retrieval baseline
        run: |
          jgrad-check-retrieval-gate \
            --report tests/fixtures/semantic_retrieval_baseline_v1.json \
            --policy config/semantic_retrieval_gate_v1.json \
            --manifest config/semantic_retrieval_gate_manifest_v1.json \
            --repository-root .
      - name: Confirm no Hugging Face cache was created
        run: test ! -e "$HF_HOME" || test -z "$(find "$HF_HOME" -mindepth 1 -print -quit)"
