[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jgrad-admission-rag"
version = "0.1.0"
description = "RAG-ready knowledge engine for Japanese graduate admission guidelines."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "PyMuPDF>=1.24.0",
    "pdfplumber>=0.11.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
]
embedding = [
    "sentence-transformers>=3.0.0",
]

[project.scripts]
jgrad-build-kb = "jgrad_admission_rag.cli.build_kb:main"
jgrad-build-index = "jgrad_admission_rag.cli.build_index:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "real_pdf: offline regression tests that require the private real admission PDF fixture",
    "model_integration: opt-in tests requiring an explicitly configured local model/cache",
]

[tool.ruff]
line-length = 100
target-version = "py310"
