<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="title desc">
  <title id="title">公式資料から、条件の照合と根拠のある説明へ</title>
  <desc id="desc">公式PDFをPyMuPDFとpdfplumberで解析し、原文とページをScopedFactに保持する。出願準備ではFactを直接参照してレビュー済みルールと申請者情報を照合し、引用付きレポートを作る。自由質問では対象を絞り、BGE-M3とBM25のハイブリッド検索を経てLLMが参考回答を整理する。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#647a8f"/></marker>
  </defs>
  <rect x="1" y="1" width="1198" height="788" rx="5" fill="#faf9f6" stroke="#d7d6d0"/>
  <g font-family="'Yu Gothic','Hiragino Kaku Gothic ProN',Meiryo,sans-serif">
    <text x="40" y="52" font-size="26" font-weight="700" fill="#253c53">公式資料から、条件の照合と根拠のある説明へ</text>
    <text x="40" y="84" font-size="17" fill="#65717b">原文・ページを共通の基盤にし、用途に応じて二つの処理を使い分ける</text>

    <g fill="#fff" stroke="#b7c1c9">
      <rect x="40" y="116" width="245" height="115" rx="4"/>
      <rect x="330" y="116" width="305" height="115" rx="4"/>
      <rect x="680" y="116" width="480" height="115" rx="4"/>
    </g>
    <g fill="#253c53" font-size="22" font-weight="700">
      <text x="60" y="151">公式 PDF</text>
      <text x="350" y="151">事実の抽出・整理</text>
      <text x="700" y="151">ScopedFact + 公式ページ</text>
    </g>
    <g fill="#52616e" font-size="16">
      <text x="60" y="183">学校・年度・資料版を識別</text>
      <text x="60" y="207">ファイルハッシュを照合</text>
      <text x="350" y="183">PyMuPDF / pdfplumber</text>
      <text x="350" y="207">文字・表・参照先を保持</text>
      <text x="700" y="183">公式原文 / Fact ID / 出典 / 適用範囲</text>
      <text x="700" y="207">文書間の関係と条件はレビューして登録</text>
    </g>
    <g fill="none" stroke="#647a8f" stroke-width="2" marker-end="url(#arrow)">
      <path d="M285 172H324"/><path d="M635 172H674"/>
      <path d="M920 231V266H310V304"/>
      <path d="M920 266H890V304"/>
    </g>

    <rect x="40" y="310" width="540" height="365" rx="4" fill="#eef2f5" stroke="#bcc9d3"/>
    <rect x="620" y="310" width="540" height="365" rx="4" fill="#f5eee7" stroke="#d6c5b6"/>
    <text x="64" y="346" font-size="20" font-weight="700" fill="#31516f">出願準備の整理</text>
    <text x="644" y="346" font-size="20" font-weight="700" fill="#865b3d">自由な質問への参考回答</text>

    <g fill="#fff" stroke="#c5cbd0">
      <rect x="64" y="366" width="492" height="110" rx="3"/>
      <rect x="644" y="366" width="492" height="110" rx="3"/>
      <rect x="64" y="520" width="492" height="110" rx="3"/>
      <rect x="644" y="520" width="492" height="110" rx="3"/>
    </g>
    <g fill="#253c53" font-size="21" font-weight="700">
      <text x="84" y="402">レビュー済みルール</text>
      <text x="664" y="402">対象を絞る → ハイブリッド検索</text>
      <text x="84" y="557">引用付きレポート・準備状況</text>
      <text x="664" y="557">LLM 参考層</text>
    </g>
    <g fill="#52616e" font-size="16">
      <text x="84" y="434">対象 + 申請者情報を明示的な条件と照合</text>
      <text x="84" y="458">必要な事実を直接参照し、適用条件を評価</text>
      <text x="664" y="434">BGE-M3 + BM25 → RRF（順位の統合）</text>
      <text x="664" y="458">検索結果は根拠候補。資格の判定ではない</text>
      <text x="84" y="590">日付・書類・試験情報 / 未準備・未確認</text>
      <text x="84" y="614">公式原文とページへ戻って確認できる</text>
      <text x="664" y="590">取得した資料を自然な文章に整理</text>
      <text x="664" y="614">資料の不足を示し、最終資格は判断しない</text>
    </g>
    <g fill="none" stroke="#647a8f" stroke-width="2" marker-end="url(#arrow)">
      <path d="M310 476V514"/><path d="M890 476V514"/>
    </g>
    <text x="64" y="657" font-size="15" fill="#31516f">東京大学の限定テーマもこの経路を利用</text>
    <text x="644" y="657" font-size="15" fill="#865b3d">学校資料の確認が必要な質問の経路を図示</text>

    <path d="M40 708H1160" fill="none" stroke="#d7d6d0"/>
    <text x="40" y="737" font-size="16" font-weight="700" fill="#253c53">共通の品質管理</text>
    <text x="198" y="737" font-size="16" fill="#52616e">資料・索引の版を分離 / 出典照合 / 固定回帰評価 / API・画面テスト</text>
    <text x="40" y="766" font-size="15" fill="#65717b">公開体験デモは保存済みの結果を表示。本体の検索・生成処理は実行しない。</text>
  </g>
</svg>
